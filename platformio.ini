; Projeto PlatformIO (opcional — também abre direto na Arduino IDE,
; basta abrir firmware/garra_esp32/garra_esp32.ino)

[platformio]
src_dir = firmware/garra_esp32

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; Nenhuma biblioteca externa necessária
